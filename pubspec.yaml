name: hungr
description: "Hungr - Hyper-Batched Morning Tiffin Subscription & Slot-Booking Engine"
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Visuals, Micro-Animations & Motion Physics
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  animations: ^2.0.11

  # Navigation & Reactive State Management
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1

  # Firebase Suite & Backend Integration
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Payments & Persistence
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.3.3

  # Utilities, Icons & Formats
  intl: ^0.19.0
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
