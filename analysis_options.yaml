include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: false
    strict-raw-types: true

  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    deprecated_member_use: ignore

  exclude:
    - build/**
    - android/**
    - web/**

linter:
  rules:
    - avoid_print
    - always_declare_return_types

